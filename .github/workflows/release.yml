name: Release build

# The Windows installer and the Linux AppImage are built here, from the source in this repository, so anyone can check
# that a published file comes from this code: one SHA256SUMS.txt for both, and a build provenance attestation GitHub
# signs for each (independent review §10; checked with gh attestation verify, docs/release.md). Started by hand or by a
# version tag. Nothing is published here: the release is made by hand from the artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # As in test.yml: a long TEMP path for the tests that compare real folder names
      - run: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      # The same gates as test.yml (independent review §10): types and lint before anything is built
      - run: npm run typecheck
      - run: npm run lint
      # No certificate on the runner: electron-builder builds the installer unsigned. It never publishes on its own (on
      # CI it would try to): the release is made by hand
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The hidden checks of the packaged app (tools/electron-qa.ps1) on this very build (dist/win-unpacked): an installer
      # whose app fails them is never uploaded
      - run: pwsh -NoProfile -File tools/electron-qa.ps1
      # The QA's own record, kept when a check fails (as in qa.yml), to see why
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qa-windows
          path: |
            qa/electron-qa-sonuc.json
            qa/electron-qa-main.log
            qa/electron-qa-server.log
          if-no-files-found: ignore
      - name: Installer SHA-256
        shell: pwsh
        run: Get-FileHash dist\SiberSentez-Setup-*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SiberSentez-Setup
          path: dist/SiberSentez-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  # Linux (plan G2): the same gates on Ubuntu, the AppImage, then the same hidden checks of the packaged app on a virtual
  # display (tools/linux-qa.sh, as the Packaged QA workflow): an AppImage whose app fails them is never uploaded
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2t64
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx electron-builder --linux AppImage --publish never
      - run: xvfb-run -a bash tools/linux-qa.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qa-linux
          path: |
            qa/linux-qa-main.log
            qa/linux-qa-shot.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SiberSentez-AppImage
          path: dist/SiberSentez-*.AppImage
          if-no-files-found: error
          retention-days: 30

  # Both files together: their SHA-256 in one SHA256SUMS.txt, and a provenance attestation for each (which workflow,
  # commit and runner built it), signed by GitHub and kept with the repository. Only this job may write attestations
  release:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      # By name, one each (a re-run must not bring back an earlier run's SiberSentez-release)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SiberSentez-Setup
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SiberSentez-AppImage
          path: release
      - name: SHA256SUMS.txt
        working-directory: release
        run: |
          sha256sum SiberSentez-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SiberSentez-release
          path: release/
          if-no-files-found: error
          retention-days: 30
