name: Release build

# The installer is built here, from the source in this repository, so anyone can check that a published installer
# comes from this code. Started by hand or by a version tag. Nothing is published here: the release is made by hand
# from the artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # As in test.yml: a long TEMP path for the tests that compare real folder names
      - run: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      # No certificate on the runner: electron-builder builds the installer unsigned. It never publishes on its own (on
      # CI it would try to): the release is made by hand
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer SHA-256
        shell: pwsh
        run: Get-FileHash dist\SiberSentez-Setup-*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" }
      - uses: actions/upload-artifact@v7
        with:
          name: SiberSentez-Setup
          path: dist/SiberSentez-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
