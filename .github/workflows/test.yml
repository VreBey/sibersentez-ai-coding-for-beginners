name: Tests

# Every push and pull request: the whole test suite on Windows (the released platform), on Linux and, experimentally,
# on macOS (plan G). No secrets are used and
# nothing is published; the installer is built by hand (npm run dist), not here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # The tests never start Electron; its 100 MB binary is not needed here
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The runner's own TEMP is an 8.3 short path (C:\Users\RUNNER~1\...): the tests compare real, long folder
      # names, as on a person's computer; the runner's work drive gives a long one
      - run: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      # Types and lint (plan D7): the files with // @ts-check on their first line, and tools/lint.mjs
      - run: npm run typecheck
      - run: npm run lint
      # Coverage (plan D2): fails when lines, branches or functions drop under the floor set in package.json
      # (lines 80, branches 86, functions 84 %); the report is in the log
      - run: npm run coverage
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      # After the tests, so a new advisory never hides their result: what ships in the app (node-pty) has no known
      # advisory; the build tools are checked by hand (docs/release.md)
      - run: npm audit --omit=dev --audit-level=low

  # Linux (plan G2): the same suite on Ubuntu; node-pty is built from source by npm ci (the runner has a compiler, make
  # and Python). Tests written with Windows' own paths are skipped there (test/lib/winonly.mjs); Linux' own behaviour,
  # the sh launcher in a real pseudo terminal included, is tested in test/platform*.test.mjs.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      # The same coverage floor as on Windows (independent review of 0.18.0 §9: functions were 83.3 % here, under it,
      # and nothing checked); the detector's and the adapters' tests now run with each platform's rules everywhere
      - run: npm run coverage

  # macOS (plan G3): experimental, never tried on a Mac; a failure here is reported, it does not fail the run
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
